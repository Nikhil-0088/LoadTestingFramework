spring.application.name=load-test-service

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:load_test}
spring.datasource.username=${DB_USER:loadtest}
spring.datasource.password=${DB_PASSWORD:loadtest_dev_password}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,info

# Internal execution capacity; clients do not supply workerCount.
loadtest.worker.max-requests-per-minute=100
loadtest.worker.max-workers-per-test=50

# The launcher can run on every application node. The database lease ensures only one node dispatches a request.
loadtest.workflow-launcher.enabled=true
loadtest.workflow-launcher.node-id=${HOSTNAME:local-dev}
loadtest.workflow-launcher.poll-interval=PT2S
loadtest.workflow-launcher.batch-size=10
loadtest.workflow-launcher.lease-duration=PT30S
loadtest.workflow-launcher.executor-pool-size=4
loadtest.workflow-launcher.executor-queue-capacity=100
loadtest.workflow-launcher.local-worker-pool-size=50
