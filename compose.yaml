services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: load_test
      MYSQL_USER: loadtest
      MYSQL_PASSWORD: loadtest_dev_password
      MYSQL_ROOT_PASSWORD: root_dev_password
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
